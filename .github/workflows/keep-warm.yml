name: Keep Neon warm

# Neon suspends an idle compute after ~5 minutes, so a shopper arriving after a
# quiet spell pays a cold start. This pings a trivial DB route on a schedule to
# keep the compute awake. GitHub's scheduler is best-effort and can be delayed
# under load — if cold starts still slip through, an external cron (e.g.
# cron-job.org) hitting the same URL every 4–5 minutes is more punctual.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-warm endpoint
        run: curl -fsS --max-time 45 "${KEEP_WARM_URL:-https://fila-t-w-y.vercel.app/api/keep-warm}"
        env:
          KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
